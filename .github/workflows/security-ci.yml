name: security-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python security/scripts/secret_scan.py .
      - run: python -m unittest discover -s security/tests/python -p 'test_*.py'
